name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 콘텐츠 품질 검사 (근거·확인일·섹션·링크)
        run: npm run validate:content
      - name: 자가진단 규칙 테스트
        run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

  examples-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-fastapi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --python 3.12 pytest -q

  examples-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
